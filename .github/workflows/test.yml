name: Build

on:
  push:
    branches:
      - master
    tags:
      - v*
  pull_request:
  workflow_dispatch:

env:
  # npm dist-tag for releases from this branch. npm's "latest" tag belongs to the
  # newest major (3.x); a 1.x release with "latest" would move it back to 1.x.
  # npm rejects a tag that looks like a semver range (such as "1.x").
  NPM_TAG: latest-1

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: pre-commit/action@v3.0.1

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # The build backend installs the newest jupyterlab 4.x, whose labextension
      # builder needs Node.js ^20.19.0 || >=22.12.0.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install build
        run: python -m pip install build

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "reacton[generate]" "ipyvue>=1.7,<2"
      - name: build wheel
        run: python -m build
      - name: Check the core-js version in the bundles
        # core-js older than 3.3.5 turns off V8's RegExp fast paths for the whole page.
        run: python .github/check_corejs.py prefix/share/jupyter/nbextensions/jupyter-vuetify/*.js prefix/share/jupyter/labextensions/jupyter-vuetify/static/*.js js/dist/*.js

      - name: Build component file
        run: |
          cp ipyvuetify/components.py ipyvuetify/components-previous.py
          python -m ipyvuetify.components
          diff ipyvuetify/components.py ipyvuetify/components-previous.py

      - name: Package js
        run: (cd js && npm pack)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ipyvuetify-dist-${{ github.run_number }}
          path: |
            ./dist
            ./js/*.tgz

      - name: Upload components
        uses: actions/upload-artifact@v4
        with:
          name: ipyvuetify-components-${{ github.run_number }}
          path: |
            ./ipyvuetify/components.py

  test:
    needs: [lint, build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: ipyvuetify-dist-${{ github.run_number }}
      - name: Install ipyvuetify
        run: python -m pip install "$(find dist -name *.whl)"
      - name: test import
        run: (mkdir test-install; cd test-install; python -c "from ipyvuetify import Btn")

  ui-test:
    needs: [lint, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/download-artifact@v4
        with:
          name: ipyvuetify-dist-${{ github.run_number }}
      - name: Install ipyvuetify
        run: python -m pip install "$(find dist -name *.whl)[test]"
      - name: Install chromium
        run: playwright install chromium
      - name: Run ui-tests
        run: pytest tests/ui/ --video=retain-on-failure --solara-update-snapshots-ci -s
      - name: Upload Test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipyvuetify-test-results
          path: test-results

  release-dry-run:
    needs: [test, ui-test]
    if: github.event.pull_request.head.repo.full_name == 'widgetti/ipyvuetify'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ipyvuetify-dist-${{ github.run_number }}

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 14
          registry-url: "https://registry.npmjs.org"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.8
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install twine

      - name: Publish the Python package
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: twine upload --skip-existing --repository testpypi dist/*

      - name: Publish the NPM package
        run: |
          cd js
          npm publish --dry-run --tag "$NPM_TAG" --access public *.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    if: startsWith(github.event.ref, 'refs/tags/v')
    needs: [test, ui-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # npm trusted publishing (OIDC), replaces the NPM_TOKEN secret
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ipyvuetify-dist-${{ github.run_number }}

      - name: Install node
        uses: actions/setup-node@v4
        with:
          # trusted publishing needs npm >= 11.5.1, which needs node >= 20
          node-version: 22

      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.8

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install twine

      - name: Publish the Python package
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --skip-existing dist/*

      - name: Publish the NPM package
        run: |
          cd js
          npm publish --tag "$NPM_TAG" --access public *.tgz
